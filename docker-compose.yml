services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticket_system
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticket_system"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://ticket:ticket@postgres:5432/ticket_system
      REDIS_URL: redis://redis:6379
      RUN_MIGRATIONS: "true"
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  backend-seed:
    build:
      context: ./backend
    profiles:
      - seed
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ticket:ticket@postgres:5432/ticket_system
      RUN_MIGRATIONS: "true"
    command: ["node", "dist/db/seed.js"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  backend-test:
    build:
      context: ./backend
      target: test
    profiles:
      - test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://ticket:ticket@postgres:5432/ticket_system
      REDIS_URL: redis://redis:6379
      RUN_MIGRATIONS: "true"
    command: ["npm", "run", "test:ci"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
