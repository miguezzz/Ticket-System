x-backend-build: &backend-build
  context: ./backend

x-backend-runtime-env: &backend-runtime-env
  NODE_ENV: production
  PORT: 3000
  REDIS_URL: redis://redis:6379
  RUN_MIGRATIONS: "true"

x-local-database-url: &local-database-url postgresql://ticket:ticket@postgres:5432/ticket_system

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticket_system
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticket_system"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      <<: *backend-build
    environment:
      <<: *backend-runtime-env
      DATABASE_URL: *local-database-url
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  backend-supabase:
    build:
      <<: *backend-build
    profiles:
      - supabase
    environment:
      <<: *backend-runtime-env
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy

  backend-seed:
    build:
      <<: *backend-build
    profiles:
      - seed
    environment:
      NODE_ENV: production
      DATABASE_URL: *local-database-url
      RUN_MIGRATIONS: "true"
    command: ["node", "dist/db/seed.js"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  backend-seed-supabase:
    build:
      <<: *backend-build
    profiles:
      - seed-supabase
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    command: ["node", "dist/db/seed.js"]

  backend-test:
    build:
      context: ./backend
      target: test
    profiles:
      - test
    environment:
      NODE_ENV: test
      DATABASE_URL: *local-database-url
      REDIS_URL: redis://redis:6379
      RUN_MIGRATIONS: "true"
    command: ["npm", "run", "test:ci"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
