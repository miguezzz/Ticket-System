services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no arquivo .env da raiz}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy

  backend-seed:
    build:
      context: ./backend
    profiles:
      - seed
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no arquivo .env da raiz}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    command: ["node", "dist/db/seed.js"]
